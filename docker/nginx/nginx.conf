# Hardened Production Nginx Reverse-Proxy for SIGIL Cluster
# Enforces TLS 1.3, Mutual TLS (mTLS) Client Verification, and Defense-Grade HTTP Security Headers

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" ssl_verify="$ssl_client_verify" '
                    'client_dn="$ssl_client_s_dn"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64M; # Support classified PDF distribution uploads

    # Upstream backend services in Docker Compose network
    upstream admin_backend {
        server admin-portal:8000;
    }

    upstream node01_backend {
        server node-01:8001;
    }

    upstream node02_backend {
        server node-02:8001;
    }

    upstream node03_backend {
        server node-03:8001;
    }

    upstream node04_backend {
        server node-04:8001;
    }

    # Redirect HTTP (Port 80) to HTTPS (Port 443)
    server {
        listen 80;
        server_name sigil.internal localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Hardened Gateway with Mutual TLS (mTLS)
    server {
        listen 443 ssl http2;
        server_name sigil.internal localhost;

        # Server TLS Certificate & Key
        ssl_certificate /etc/ssl/certs/admin_portal.crt;
        ssl_certificate_key /etc/ssl/certs/admin_portal.key;

        # Root CA for Client Certificate Validation (mTLS)
        ssl_client_certificate /etc/ssl/certs/ca.crt;
        # Set to 'on' for strict mTLS or 'optional' for flexible enterprise gateway
        ssl_verify_client optional;
        ssl_verify_depth 2;

        # TLS Protocols & Cipher Suite (Strictly TLS 1.2 / TLS 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Defense-in-Depth Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:;" always;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward mTLS client identity to application layer
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;

        # Security Officer Command Console & Static UI
        location / {
            proxy_pass http://admin_backend;
            proxy_read_timeout 90s;
        }

        # Dedicated Routes for Cluster Validator Nodes
        location /node/01/ {
            rewrite ^/node/01/(.*)$ /$1 break;
            proxy_pass http://node01_backend;
        }

        location /node/02/ {
            rewrite ^/node/02/(.*)$ /$1 break;
            proxy_pass http://node02_backend;
        }

        location /node/03/ {
            rewrite ^/node/03/(.*)$ /$1 break;
            proxy_pass http://node03_backend;
        }

        location /node/04/ {
            rewrite ^/node/04/(.*)$ /$1 break;
            proxy_pass http://node04_backend;
        }
    }
}
