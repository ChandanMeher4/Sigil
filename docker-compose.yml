    ports:
      - "8003:8001"
    volumes:
      - ./data/node_03:/app/data/node_03
    restart: unless-stopped
    networks:
      - sigil-net

  node-04:
    build: .
    container_name: sigil-node-04
    command: python -m uvicorn validator_node.main:app --host 0.0.0.0 --port 8001
    environment:
