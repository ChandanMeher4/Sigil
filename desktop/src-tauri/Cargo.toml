[package]
name = "sigil-reader"
version = "1.0.0"
description = "SIGIL Post-Quantum Classified Viewer Shell"
authors = ["SIGIL Defense Technologies"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-sidecar", "process-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
